<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="script.js" defer></script>
  <title>3D Solar System</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: sans-serif;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 10px;
      z-index: 10;
    }

    label {
      display: block;
      margin: 5px 0 2px;
      font-size: 14px;
    }

    input[type=range] {
      width: 120px;
    }

    button {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 14px;
      background-color: rgb(182, 221, 254);
      border-radius: 5px;
      border: none;
    }
  </style>
</head>

<body>
  <div id="controls">
    <div id="globalControl">
      <label for="speedSlider">Global Speed</label>
      <input type="range" id="speedSlider" min="0.01" max="10" value="0.5" step="0.01">
    </div>
    <div id="planetControls"></div>
    <button id="toggle">Pause</button>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>

</body>

</html>
