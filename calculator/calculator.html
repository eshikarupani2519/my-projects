<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="calculator.js" defer></script>
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <div class="container">
       <div class="input">
        <input type="text" class="d-yes" id="ip" disabled>
        <p class="ans"></p>
       </div>
        <hr>
        <div class="calc">
            <div class="row">
                <button type="button" id="per">%</button>
                <button type="button" id="CE">CE</button>
                <button type="button" id="AC">AC</button>
                <button type="button" id="back"><img height="30px" src="https://th.bing.com/th/id/OIP.ByPhuCz7A-X6kUIJGooGugHaHa?w=180&h=180&c=7&r=0&o=5&dpr=1.5&pid=1.7" alt=""></button>
            </div>
            <div class="row">
                <button type="button" id="inverse">1/x</button>
                <button type="button" id="sq">x^2</button>
                <button type="button" id="sq-root">2√x</button>
                <button type="button" id="divi">/</button>   
            </div>
            <div class="row">
                <button type="button" id="sev">7</button>
                <button type="button" id="eig">8</button>
                <button type="button" id="nine">9</button>
                <button type="button" id="mul">*</button>
            </div>
            <div class="row">
                <button type="button" id="four">4</button>
                <button type="button" id="five">5</button>
                <button type="button" id="six">6</button>
                <button type="button" id="minus">-</button>
            </div>
            <div class="row">
                <button type="button" id="one">1</button>
                <button type="button" id="two">2</button>
                <button type="button" id="thr">3</button>
                <button type="button" id="plus">+</button>
            </div>
            <div class="row">
                <button type="button" id="plusormin">+/-</button>
                <button type="button" id="zero">0</button>
                <button type="button" id="point">.</button>
                <button type="button" id="equal">=</button>
            </div>
        </div>
    </div>
</body>

</html>
