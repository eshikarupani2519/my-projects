<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- main box starts -->
     <div class="d-flex">
        <!-- background image -->
        <!-- left part starts -->
        <div class="left d-flex">
            <img src="star.svg" alt="" height="65px" width="65px">
            <div class="text d-flex">
                <h1>Dovetail</h1>
                <h1>India</h1>
                <p>Welcome back to the Dovetail Panel. Login here to start accessing the Funds and Reports.</p>
            </div>
        </div>
        <!-- left part ends -->

        <!-- right part starts -->
         <div class="right d-flex">
            <img src="logo.svg" alt="" height="120px" width="120px">
            <h1>Welcome back</h1>
            <p>Login to the Dovetail Admin panel portal</p>
            <div class="checkbox">
                <label for="investor" class="custom-checkbox">
                    <input type="checkbox" id="investor" name="choice">
                    <span></span>&nbsp;Are you an investor
                    
                </label>
            </div>
            <div class="login-container">
                <form class="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter email here">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter password here">
                    </div>
                    <button class="login-btn" type="submit">Login</button>
                    <div class="forgot-password">
                        <a href="#">Forgot Password? <span>Click Here</span></a>
                    </div>
                </form>
            </div>
         </div>
         <!-- right part ends -->
     </div>
    
     <!-- main box ends -->
     
    
    
    
    
</body>
</html>
